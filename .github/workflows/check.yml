name: Validate installer
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install validation tools
        run: sudo apt-get update && sudo apt-get install -y shellcheck jq
      - name: Shell syntax and static analysis
        run: |
          bash -n install-vless-chain.sh
          shellcheck install-vless-chain.sh
      - name: Download verified official core for schema tests
        run: |
          curl -fsSL --max-time 180 -o /tmp/sing-box.tar.gz https://github.com/SagerNet/sing-box/releases/download/v1.14.3/sing-box-1.14.3-linux-amd64.tar.gz
          echo 'e2bdf179c15a3652955dc44867e33ca0965c9c9b91b34267dcc5a5d639a5feee  /tmp/sing-box.tar.gz' | sha256sum -c -
          tar -xzf /tmp/sing-box.tar.gz -C /tmp
      - name: Config, input validation and rollback contracts
        env:
          SING_BOX_BIN: /tmp/sing-box-1.14.3-linux-amd64/sing-box
        run: python3 -m unittest discover -s tests -v
  alpine-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        alpine: ['3.21', '3.24']
    steps:
      - uses: actions/checkout@v4
      - name: Install validation tools
        run: sudo apt-get update && sudo apt-get install -y jq
      - name: Install both roles in fresh Alpine containers
        env:
          ALPINE_VERSION: ${{ matrix.alpine }}
        run: timeout 480 bash tests/integration.sh
